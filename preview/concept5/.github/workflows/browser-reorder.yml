name: Real browser checks for word ordering
on:
  push:
    branches: [feat/v015-reorder-words]
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npx playwright test --config tests/browser-reorder.config.cjs --browser chromium --reporter=list
      - name: Unit reorder regressions
        run: node --test tests/reorder.test.mjs
