name: Vocabulary order regression
on:
  push:
    branches: [feat/v015-reorder-words]
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  reorder-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/reorder.test.mjs
