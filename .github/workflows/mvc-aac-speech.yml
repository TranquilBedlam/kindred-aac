name: MVC AAC speech regression
on:
  push:
    branches: [refactor/mvc-aac-speech-service]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and full unit regressions
        run: |
          node --check src/main-pip-browser.js
          node --check src/aac/speech-service.js
          node --test tests/aac-speech-service.test.mjs tests/aac-vocabulary-store.test.mjs tests/aac-preference-store.test.mjs tests/milo-view.test.mjs tests/milo-controller.test.mjs tests/pip-audio-service.test.mjs tests/pip-regression.test.mjs tests/learning.test.mjs tests/reorder.test.mjs tests/aac-voice.test.mjs
      - name: Browser AAC and story regression
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
          npx playwright test tests/pip-regression.browser.spec.cjs tests/browser-arrange.spec.cjs --browser chromium --workers=1 --reporter=list
