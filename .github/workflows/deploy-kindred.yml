name: Deploy Kindred AAC
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "kindred-pages"
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout app release
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Check version and story
        run: |
          test -s index.html
          test -s src/maya/characters/maya/layers.json
          grep -q 'v=0.18.0' index.html
          grep -q 'Follow the footprints' src/main.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
