name: Publish Kindred AAC Website
# Deployment must originate on gh-pages, permitted by environment protection.
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: kindred-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out published app
        uses: actions/checkout@v4
      - name: Confirm release assets with clear diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "Published commit: $(git rev-parse --short HEAD)"
          echo "Files in release root:"
          ls -la
          for file in index.html src/main.js src/maya/characters/maya/layers.json; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty release file: $file"
              exit 1
            fi
            echo "Found: $file"
          done
          if ! grep -Fq 'Follow the footprints' src/main.js; then
            echo "::error::Expected Forest adventure choice missing from src/main.js"
            exit 1
          fi
          if ! grep -Fq 'v=0.18.0' index.html; then
            echo "::error::index.html does not reference the v0.18.0 release"
            exit 1
          fi
          echo "All v0.18.0 release checks passed"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
