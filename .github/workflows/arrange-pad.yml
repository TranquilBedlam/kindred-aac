name: Parent visual pad acceptance
on:
  push:
    branches: [feat/parent-arrange-pad]
  pull_request:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser-arrange.spec.cjs --browser chromium --reporter=list
      - run: node --test tests/reorder.test.mjs
