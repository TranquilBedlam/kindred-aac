name: MVC audio refactor regression
on:
  push:
    branches: [refactor/mvc-audio-service]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check src/aac/pip-audio-service.js
          node --check src/main-pip-browser.js
      - name: Full unit regressions
        run: node --test tests/pip-audio-service.test.mjs tests/pip-regression.test.mjs tests/learning.test.mjs tests/reorder.test.mjs tests/aac-voice.test.mjs
      - name: Chromium browser tests
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
          npx playwright test tests/pip-regression.browser.spec.cjs tests/browser-arrange.spec.cjs --browser chromium --workers=1 --reporter=list
